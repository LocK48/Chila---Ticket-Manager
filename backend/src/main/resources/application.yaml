spring:
  config:
    # Support starting Spring Boot from either the backend directory or project root.
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:./backend/.env[.properties]
  application:
    name: chila-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:${POSTGRESQL_DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:chila}}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:${POSTGRESQL_USER:chila}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:${POSTGRESQL_PASSWORD:change-me-local-only}}}
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_STARTTLS:true}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

chila:
  cors:
    allowed-origin: ${CHILA_CORS_ALLOWED_ORIGIN:http://localhost:5173}
  auth:
    cookie-secure: ${CHILA_AUTH_COOKIE_SECURE:false}
    jwt-secret: ${CHILA_JWT_SECRET}
    jwt-issuer: ${CHILA_JWT_ISSUER:chila-local}
  email:
    from: ${CHILA_EMAIL_FROM:}
